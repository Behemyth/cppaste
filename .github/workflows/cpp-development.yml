name: C++ Development Workflow

on:
  push:
    branches:
      - development

jobs:
  development-upload:
    runs-on: ubuntu-latest

    steps:
      - name: conan-upload
        uses: grisumbras/conan-upload@v0.3.0
        login: ${{ secrets.CONAN_USER }}
        password: ${{ secrets.CONAN_PASSSWORD }}
        url: ${{ secrets.CONAN_SERVER }}