name: C++ Development Workflow

on:
  push:
    branches:
      - development

jobs:
  development-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Python Poetry Action
        uses: abatilo/actions-poetry@v1.8.0
        with:
          python_version: 3.8
          poetry_version: 1.0
          args: install

      - name: conan-upload
        uses: grisumbras/conan-upload@v0.3.0
        with:
          login: ${{ secrets.CONAN_USER }}
          password: ${{ secrets.CONAN_PASSSWORD }}
          url: ${{ secrets.CONAN_SERVER }}