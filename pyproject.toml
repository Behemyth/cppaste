[tool.poetry]
name = "cppaste"
description = ""

license = "MIT"

authors = [
  {name = "Synodic Software", email = "contact@synodic.software"},
]

readme = "README.adoc"

dynamic = ["version"]

dependencies = []
requires-python = ">=3.11"

[project.license-files]
paths = ["LICENSE.md"]

[project.urls]
homepage = "https://github.com/Synodic-Software/CPPaste"
repository = "https://github.com/Synodic-Software/CPPaste"


[tool.pdm.dev-dependencies]
dev = [
  "cmake>=3.26.1",
  "cppython-conan>=0.0.0.dev1",
  "cppython-pdm>=0.2.8.dev2",
]

[build-system]
build-backend = "pdm.pep517.api"
requires = ["pdm-pep517"]
